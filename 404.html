<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Case Not Found | SlopCourt</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="./" aria-label="SlopCourt home">
        <span class="brand-mark" aria-hidden="true">SC</span>
        <span>
          <strong>SlopCourt</strong>
          <small>public vibe tribunal</small>
        </span>
      </a>
      <nav aria-label="Primary navigation">
        <a href="./#court">Court</a>
        <a href="./#docket">Docket</a>
      </nav>
      <span class="status-chip">404</span>
    </header>

    <main>
      <section class="case-page panel">
        <div class="section-kicker">Missing case</div>
        <h1>This case is not on the docket.</h1>
        <p class="lede">
          The public docket is generated from repo JSON files. Head back to the docket or load a permalinked case.
        </p>
        <div class="case-page-actions">
          <a class="case-page-link" href="./#docket">Open docket</a>
          <a class="case-page-link secondary" href="./#court">Open court</a>
        </div>
      </section>
    </main>
  </body>
</html>
